# configs/rag_config.yaml
vector_store:
  type: "chromadb"
  persist_directory: "./data/embeddings"
  collection_name: "research_docs"

document_processing:
  chunk_size: 1000
  chunk_overlap: 200
  supported_formats: [".pdf", ".txt", ".docx", ".md"]

retrieval:
  similarity_threshold: 0.7
  max_results: 5
  rerank: true

embedding:
  model: "all-MiniLM-L6-v2"
  batch_size: 32
  device: "cuda"